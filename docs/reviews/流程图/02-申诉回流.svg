<text x="85" y="2470" font-family="Noto Sans SC" font-size="22" fill="#536980" text-anchor="start" font-weight="normal">准入：成立 / 部分成立；本人、最新、已送达；理由与有效证据齐全；同版无并行有效申诉且未实质办结。</text>
<text x="85" y="2506" font-family="Noto Sans SC" font-size="22" fill="#536980" text-anchor="start" font-weight="normal">回路：撤回 / 不受理可补正重提；同版实质办结后的新证据由主管跟进；新不利版本可再次申诉。</text>
<text x="85" y="2542" font-family="Noto Sans SC" font-size="22" fill="#536980" text-anchor="start" font-weight="normal">联动：全部暂停来源解除后按实际暂停时长顺延，保留曾逾期；暂停可补材料与留草稿，禁止验收通过 / 结案。</text>
<text x="85" y="2578" font-family="Noto Sans SC" font-size="22" fill="#536980" text-anchor="start" font-weight="normal">边界：活跃申诉禁止从原问题旁路改写结论；原质检员核查须注明无人可替代；改判保留旧结论与历史。</text>
<text x="85" y="2614" font-family="Noto Sans SC" font-size="22" fill="#536980" text-anchor="start" font-weight="normal">证据不足：终止不计完成或误报；补证回主管，重新确认成立且需整改时新建关联整改；已结案仅追加改判标记。</text>
